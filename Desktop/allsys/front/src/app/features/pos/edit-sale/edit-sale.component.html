<div class="page-container" *ngIf="!cargando">
  
  <header class="form-header header-top">
    <div class="title-group">
      <span class="text-muted" (click)="volver()" style="cursor: pointer;">← Volver al Historial</span>
      <h2 class="title mt-1">Editar Venta: {{ venta.codigo_venta }}</h2>
      <p class="subtitle">Registrada el {{ venta.fecha | date:'dd/MM/yyyy HH:mm' }} | Canal: {{ venta.canal }}</p>
    </div>
  </header>

  <div class="product-form">
    
    <section class="card-section">
      <div class="section-header"><h3>Estados de la Venta</h3></div>
      <div class="grid-3" style="display: grid; grid-template-columns: repeat(3, 1fr); gap: 15px;">
        
        <div class="field">
          <label>Estado del Pedido</label>
          <select [(ngModel)]="formData.estado_venta" [ngClass]="{'border-danger': formData.estado_venta === 'cancelada'}">
            <option value="procesando">⏳ Procesando</option>
            <option value="enviada">🚚 Enviada</option>
            <option value="completada">✅ Completada</option>
            <option value="devuelta">↩️ Devuelta</option>
            <option value="cancelada">❌ Cancelada (Devuelve Stock)</option>
          </select>
        </div>

        <div class="field">
          <label>Estado del Pago</label>
          <select [(ngModel)]="formData.estado_pago">
            <option value="pendiente">Pendiente</option>
            <option value="pagado">Pagado</option>
            <option value="reembolsado">Reembolsado</option>
          </select>
        </div>

        <div class="field">
          <label>Método de Pago</label>
          <select [(ngModel)]="formData.metodo_pago">
            <option value="efectivo">Efectivo</option>
            <option value="tarjeta">Tarjeta</option>
            <option value="bizum">Bizum</option>
            <option value="plataforma">Plataforma (Web/Vinted)</option>
          </select>
        </div>
      </div>
    </section>

    <section class="card-section">
      <div class="section-header"><h3>Logística y Envío</h3></div>
      <div class="grid-3" style="display: grid; grid-template-columns: repeat(3, 1fr); gap: 15px;">
        <div class="field">
          <label>Estado de Envío</label>
          <select [(ngModel)]="formData.estado_envio">
            <option value="pendiente_envio">Pendiente de Envío</option>
            <option value="enviado">Enviado</option>
            <option value="entregado">Entregado</option>
            <option value="recogido_en_tienda">Recogido en Tienda</option>
          </select>
        </div>
        <div class="field">
          <label>Empresa Transporte</label>
          <input type="text" [(ngModel)]="formData.empresa_transporte" placeholder="Ej: Correos, InPost">
        </div>
        <div class="field">
          <label>Número Seguimiento</label>
          <input type="text" [(ngModel)]="formData.numero_seguimiento" placeholder="Ej: PKG123456789">
        </div>
      </div>
    </section>

    <section class="card-section">
      <div class="section-header"><h3>Cliente y Notas</h3></div>
      <div class="grid-2" style="display: grid; grid-template-columns: 1fr 1fr; gap: 15px;">
        <div class="field">
          <label>Nombre del Cliente</label>
          <input type="text" [(ngModel)]="formData.nombre_cliente">
        </div>
        <div class="field">
          <label>Email del Cliente</label>
          <input type="email" [(ngModel)]="formData.email_cliente">
        </div>
      </div>
      <div class="field" style="margin-top: 15px;">
        <label>Notas Internas (Solo visibles para staff)</label>
        <textarea [(ngModel)]="formData.notas_internas" rows="3" placeholder="Ej: Cliente pidió cambio de talla después de pagar..."></textarea>
      </div>
    </section>

    <div class="form-actions">
      <button type="button" class="btn-outline-primary" (click)="volver()">Cancelar</button>
      <button type="button" class="btn-primary main-submit" [disabled]="guardando" (click)="guardarCambios()">
        {{ guardando ? 'Guardando...' : '💾 Guardar Cambios' }}
      </button>
    </div>

  </div>
</div>
