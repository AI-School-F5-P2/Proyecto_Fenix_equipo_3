<div class="page-container">
  <div class="form-header">
    <h2 class="title">{{ isEditMode ? 'Editar' : 'Agregar' }} producto</h2>

    <button 
      type="button" 
      class="btn-text-danger delete-product-btn" 
      *ngIf="isEditMode" 
      (click)="moverProductoPapelera()" 
      [disabled]="isSubmitting || cargandoDatos">
      🗑️ Eliminar Producto
    </button>
  </div>

  <form class="product-form" (ngSubmit)="onSubmit()">
    
    <section class="card-section">
      <div class="section-header">
        <h3>Datos básicos</h3>
      </div>
      
      <div class="grid-2">
        <div class="field">
          <label>
            Nombre del Producto 
            <span class="required-web-asterisk" *ngIf="productoVaAPublicarse()" title="Requerido para publicar">*</span>
          </label>
          <input type="text" [(ngModel)]="nombre" name="nombre" placeholder="Ej: Camiseta Oversize" />
        </div>

        <div class="field marca-autocomplete">
          <label>Marca <span class="required-asterisk" title="Requerido para inventario">*</span></label>
          <app-brand-selector 
            [marcaInicial]="marcaSeleccionada"
            (brandChanged)="onBrandChanged($event)">
          </app-brand-selector>
        </div>

        <div class="field">
          <label>Condición de la prenda <span class="required-asterisk">*</span></label>
          <div class="custom-select">
            <select [(ngModel)]="estadoSeleccionado" name="estadoSeleccionado">
              <option value="nuevo">✨ Nuevo / Con etiquetas</option>
              <option value="segunda_mano">♻️ Usado / Segunda Mano</option>
              <option value="reacondicionado">🛠️ Reacondicionado (Reparado)</option>
            </select>
          </div>
        </div>

        <div class="field">
          <label class="toggle-switch" style="margin-top: 25px;">
            <input type="checkbox" [(ngModel)]="esVintage" name="esVintage" (change)="onVintageChange()" />
            <span class="slider"></span>
            <span class="toggle-label">¿Es una prenda <b>Vintage</b>?</span>
          </label>
        </div>

        <div class="field" *ngIf="esVintage">
          <label>Época / Década <span class="required-asterisk">*</span></label>
          <div class="custom-select">
            <select [(ngModel)]="epoca" name="epoca">
              <option [ngValue]="null">Selecciona década...</option>
              <option value="70s">Años 70 o anterior</option>
              <option value="80s">Años 80</option>
              <option value="90s">Años 90</option>
              <option value="Y2K">Y2K (Principios de los 2000)</option>
            </select>
          </div>
        </div>
      </div>

      <div class="field full-width">
        <label>Concepto e Información General</label>
        <textarea 
          [(ngModel)]="descripcion" 
          name="descripcion" 
          rows="3"
          placeholder="Describe la colección, inspiración o beneficios que comparten todas las variantes (Ej: Diseño artesanal, incluye empaque de regalo...)">
        </textarea>
      </div>
    </section>

    <section class="card-section">
      <div class="section-header">
        <h3>Categoría <span class="required-asterisk" title="Requerido para inventario">*</span></h3>
      </div>
      <app-category-selector 
        [categoriaInicial]="categoriaSeleccionadaFinal" 
        (categorySelected)="onCategorySelected($event)">
      </app-category-selector>
    </section>

    <div class="variants-container"  *ngIf="categoriaSeleccionadaFinal" cdkDropList [cdkDropListData]="variantes" (cdkDropListDropped)="onVariantDrop($event)">
      
      <div class="variant-card" [id]="'variante-' + v.id" *ngFor="let v of variantes; let i=index" cdkDrag>
        <div class="example-custom-placeholder" *cdkDragPlaceholder></div>
        
        <div class="variant-header" cdkDragHandle> 
          <div class="variant-title-group">
            <span class="drag-icon">⠿</span> 
            <h3 class="variant-title">Variante #{{i+1}}: 
              <span class="variant-highlight">{{ v.identidad_variante || 'Sin definir' }}</span>
            </h3>
            <span class="color-dot" *ngIf="v.hex_identidad && v.hex_identidad !== '#FFFFFF'" [style.background]="v.hex_identidad"></span>
          </div>
          <p class="drag-hint">Arrastra desde aquí para reordenar los estilos.</p>
        </div>

        <div class="field full-width" style="background: #f8fafc; padding: 15px; border-radius: 8px; border: 1px solid #e2e8f0; margin-bottom: 15px;">
          <label style="font-weight: 600; font-size: 1.1rem; color: #2c3e50; margin-bottom: 10px;">
            {{ ejeVariacion.label }} <span class="required-asterisk">*</span>
          </label>

          <app-color-selector 
            *ngIf="ejeVariacion.tipo === 'color'"
            [initialHex]="v.hex_identidad" 
            (colorChanged)="onVariantColorChanged(v, $event)">
          </app-color-selector>

          <div class="custom-select" *ngIf="ejeVariacion.tipo === 'dropdown'">
            <select [(ngModel)]="v.identidad_variante" (ngModelChange)="onVariantDropdownChanged(v)" [name]="'var_ident_' + v.temp_id">
              <option value="" disabled selected>Selecciona el material principal...</option>
              <option *ngFor="let opt of ejeVariacion.opciones" [value]="opt">{{ opt }}</option>
            </select>
          </div>

          <input 
            *ngIf="ejeVariacion.tipo === 'texto'"
            type="text" 
            [(ngModel)]="v.identidad_variante" 
            [name]="'var_ident_' + v.temp_id" 
            [placeholder]="ejeVariacion.placeholder" />
        </div>

        <div class="field image-upload-section">
          
          <div style="display: flex; justify-content: space-between; align-items: flex-end; margin-bottom: 10px;">
            <label style="margin: 0;">
              Fotos del estilo
              <span class="required-web-asterisk" *ngIf="varianteVaAPublicarse(v)" title="Requerido para publicar">*</span>
            </label>
            
            <div class="action-buttons" style="display: flex; gap: 8px;">
              
              <input 
                type="file" 
                accept="image/*" 
                multiple
                (change)="onFilesSelected($event, i)" 
                #fileInput 
                style="display: none;">
              <button 
                type="button" 
                class="btn-outline-primary" 
                style="padding: 4px 10px; font-size: 0.9em; display: flex; align-items: center; gap: 5px;"
                (click)="fileInput.click()">
                <span>📁</span> Subir fotos
              </button>

              <input 
                type="file" 
                accept="image/jpeg, image/png, image/jpg" 
                capture="environment" 
                (change)="onFilesSelected($event, i)" 
                #cameraInput 
                style="display: none;">
              <button 
                type="button" 
                class="btn-outline-primary" 
                style="padding: 4px 10px; font-size: 0.9em; display: flex; align-items: center; gap: 5px;"
                (click)="cameraInput.click()">
                <span>📸</span> Cámara
              </button>

            </div>
          </div>

          <app-image-manager
            [variantId]="v.temp_id"
            [imagenes]="v.imagenes"
            [imagenesFiles]="v.imagenesFiles"
            (imagesChanged)="v.imagenes = $event.imagenes; v.imagenesFiles = $event.files">
          </app-image-manager>
          
        </div>

        <div class="field full-width">
          <label>Descripción específica de este estilo ({{ v.identidad_variante }})</label>
          <textarea [(ngModel)]="v.descripcion" [name]="'desc_var_' + v.temp_id" rows="2" placeholder="Ej: estilo, color..."></textarea>
        </div>

        <div class="stock-section">
          <h4 class="stock-title">Unidades en Inventario</h4>
          
          <div class="stock-list" cdkDropList [cdkDropListData]="v.stocks" (cdkDropListDropped)="onStockDrop($event, i)">
            <div class="stock-item" *ngFor="let s of v.stocks; let j=index" cdkDrag>
              
              <div class="stock-header" cdkDragHandle>
                <span class="drag-icon">⠿</span> Medida/Talla #{{j+1}}
              </div>
              
              <div class="grid-4">
                
                <ng-container *ngFor="let attr of s.atributos; let k=index">
                  <div class="field" *ngIf="attr.nombre !== mapeoIdentidadPorCategoria">
                    
                    <label>
                      {{ formatLabel(attr.nombre) }}
                      <span class="required-asterisk" *ngIf="attr.nombre === 'talla'" title="Requerido para inventario">*</span>
                      <span class="required-web-asterisk" *ngIf="(s.publicar_web || s.publicar_vinted || s.publicar_wallapop) && attr.nombre === 'peso_kg'" title="Requerido para envíos">*</span>
                    </label>

                    <app-color-selector 
                      *ngIf="attr.tipo === 'color-dropdown'"
                      [initialHex]="getHexColor(attr.valor)" 
                      (colorChanged)="attr.valor = $event.nombre">
                    </app-color-selector>

                    <input 
                      *ngIf="attr.tipo !== 'color-dropdown' && attr.tipo !== 'select'" 
                      [type]="attr.tipo" 
                      [(ngModel)]="attr.valor" 
                      [name]="'attr_' + s.temp_id + '_' + attr.nombre" 
                      [placeholder]="getPlaceholder(attr.nombre)" />

                    <div class="custom-select" *ngIf="attr.tipo === 'select'">
                      <select [(ngModel)]="attr.valor" [name]="'attr_' + s.temp_id + '_' + attr.nombre">
                        <option [ngValue]="null" disabled selected>Selecciona...</option>
                        <option *ngFor="let opt of attr.opciones" [value]="opt">{{ opt }}</option>
                      </select>
                    </div>

                  </div>
                </ng-container>

                <div class="field">
                  <label>Unidades / stocks <span class="required-asterisk" title="Requerido para inventario">*</span></label>
                  <input type="number" [(ngModel)]="s.stock" [name]="'stock_' + s.temp_id" />
                </div>

                

                <div class="field">
                  <label>Precio Compra <span class="required-asterisk" title="Requerido para inventario">*</span></label>
                  <input type="number" step="0.01" [(ngModel)]="s.precio_compra" [name]="'pc_' + s.temp_id" />
                </div>

                <div class="field proveedor-autocomplete">
                  <label>Proveedor <span class="required-asterisk" title="Requerido para inventario">*</span></label>
                  <app-supplier-selector tipoProveedor="inventario" [proveedorInicialId]="s.proveedor_id" (supplierChanged)="onSupplierChanged($event, s)"></app-supplier-selector>
                </div>

                <div class="field">
                  <label>Fecha de Compra <span class="required-asterisk" title="Requerido para inventario">*</span></label>
                  <input type="date" [(ngModel)]="s.fecha_compra" [name]="'fecha_compra_' + s.temp_id" />
                </div>

                <div class="field">
                  <label>
                    Precio Venta 
                    <span class="required-web-asterisk" *ngIf="s.publicar_web || s.publicar_vinted || s.publicar_wallapop" title="Requerido para publicar">*</span>
                  </label>
                  <input type="number" step="0.01" [(ngModel)]="s.precio_venta" [name]="'pv_' + s.temp_id" />
                </div>

                <div class="field">
                  <label>Ubicación de almacenaje <span class="required-asterisk" title="Requerido para inventario">*</span></label>
                  <input type="text" [(ngModel)]="s.ubicacion" [name]="'ubicacion_' + s.temp_id" placeholder="Pasillo A, Caja 2..." />
                </div>

                <div class="field advanced-id-field" *ngIf="!s.id">
                  <label style="color: #e74c3c; font-size: 0.8rem;">⚠️ ID Manual (Solo Excel)</label>
                  <input type="number" [(ngModel)]="s.id_manual" [name]="'id_manual_' + s.temp_id" placeholder="Dejar vacío por defecto" style="border-color: #fceceb; background-color: #fceceb; font-size: 0.8rem;" />
                </div>

                <div class="field">
                  <label>Descuento %</label>
                  <input type="number" [(ngModel)]="s.descuento" [name]="'desc_' + s.temp_id" />
                </div>

                <div class="field" style="position: relative; z-index: 100;">
                  <label>Dueño de la prenda <span class="required-asterisk">*</span></label>
                  <app-client-selector
                    [clienteInicialId]="s.propietario_id"
                    (clientSelected)="s.propietario_id = $event">
                  </app-client-selector>
                </div>

                <div class="field">
                  <label>
                    {{ s.propietario_id ? 'Comisión para el Cliente' : 'Precio Compra' }} 
                    <span class="required-asterisk" title="Requerido para inventario">*</span>
                  </label>
                  <input type="number" step="0.01" [(ngModel)]="s.precio_compra" [name]="'pc_' + s.temp_id" [placeholder]="s.propietario_id ? 'Ej: 5.00 o 0' : ''" />
                </div>

                <!-- <div class="field">
                  <label>Dueño de la prenda <span class="required-asterisk">*</span></label>
                  <div class="custom-select">
                    <select [(ngModel)]="s.propietario_id" [name]="'prop_' + s.temp_id">
                      <option [ngValue]="null">🏢 Inventario Propio (Allsys)</option>
                      <option *ngFor="let c of clientesLista" [ngValue]="c.id">
                        👤 {{ c.nombre }} {{ c.apellidos || '' }} {{ c.usuario_vinted ? '(@' + c.usuario_vinted + ')' : '' }}
                      </option>
                    </select>
                  </div>
                </div>

                <div class="field">
                  <label>
                    {{ s.propietario_id ? 'Comisión para el Cliente' : 'Precio Compra' }} 
                    <span class="required-asterisk" title="Requerido para inventario">*</span>
                  </label>
                  <input type="number" step="0.01" [(ngModel)]="s.precio_compra" [name]="'pc_' + s.temp_id" [placeholder]="s.propietario_id ? 'Ej: 5.00 o 0' : ''" />
                </div> -->
              </div>

              <div class="stock-footer">
                <div class="publish-options">
                  <label class="toggle-switch">
                    <input type="checkbox" [(ngModel)]="s.publicar_web" [name]="'w_' + s.temp_id" />
                    <span class="slider"></span>
                    <span class="toggle-label">Publicar en Web</span>
                  </label>
                </div>
                <button type="button" class="btn-text-danger" (click)="eliminarStock(i,j)">Eliminar stock</button>
              </div>
            </div>
          </div>

          <button type="button" class="btn-outline-primary" (click)="agregarStock(i)">+ Añadir otra medida/talla</button>
        </div>

        <div class="variant-actions">
          <button type="button" class="btn-text-danger" (click)="eliminarVariante(i)">Eliminar este estilo completo</button>
        </div>
      </div>

      <button type="button" class="btn-outline-primary full-width-btn" (click)="agregarVariante()">+ Añadir otro Estilo/Material/Color</button>
    </div>

    <div class="form-actions">
      <button type="submit" class="btn-primary main-submit" [disabled]="isSubmitting || cargandoDatos">
        <span *ngIf="isSubmitting">⏳ Guardando...</span>
        <span *ngIf="!isSubmitting">{{ isEditMode ? 'Guardar Cambios' : 'Publicar Producto' }}</span>
      </button>
    </div>
  </form>
</div>
