<button type="button" class="btn-danger" (click)="eliminarProducto()">
  🗑️ Eliminar producto
</button>

<div class="product-form" *ngIf="producto && !cargando">
  <h2>Editar Producto</h2>

  <form (ngSubmit)="guardarProducto()">

    <!-- ================= DATOS BÁSICOS ================= -->
    <label>Nombre</label>
    <input [(ngModel)]="producto.nombre" name="nombre" required />

    <label>Marca</label>
    <select [(ngModel)]="marcaSeleccionada" name="marca" required>
      <option [ngValue]="null" disabled>Seleccionar marca</option>
      <option *ngFor="let marca of marcas" [ngValue]="marca.id">
        {{ marca.nombre }}
      </option>
    </select>

    <label>Descripción</label>
    <textarea [(ngModel)]="producto.descripcion" name="descripcion"></textarea>

    <label>Precio venta</label>
    <input type="number" [(ngModel)]="producto.precio" name="precio" />

    <label>Tipo</label>
    <input [(ngModel)]="producto.tipo" name="tipo" />

    <!-- ================= DATOS DE COMPRA ================= -->
    <h3>Datos de compra</h3>

    <label>Lugar de compra</label>
    <input [(ngModel)]="producto.lugar_compra" name="lugar_compra" />

    <label>Fecha de compra</label>
    <input type="date" [(ngModel)]="producto.fecha_compra" name="fecha_compra" />

    <label>Precio de compra</label>
    <input
      type="number"
      [(ngModel)]="producto.precio_compra"
      name="precio_compra"
      step="0.01"
    />

    <!-- ================= VARIANTES ================= -->
    <h3>Variantes</h3>

    <div *ngFor="let v of producto.variantes; let i = index" class="variant">

      <label>Color (hex)</label>
      <input [(ngModel)]="v.color" name="color-{{i}}" />

      <label>Nombre color</label>
      <input [(ngModel)]="v.color_nombre" name="colorNombre-{{i}}" />

      <label>Precio</label>
      <input type="number" [(ngModel)]="v.precio" name="precioVar-{{i}}" />

      <label>Descuento</label>
      <input type="number" [(ngModel)]="v.descuento" name="descuento-{{i}}" />

      <div *ngFor="let t of v.tallas; let j = index">
        <label>Talla</label>
        <input [(ngModel)]="t.talla" name="talla-{{i}}-{{j}}" />

        <label>Stock</label>
        <input type="number" [(ngModel)]="t.stock" name="stock-{{i}}-{{j}}" />

        <button type="button" (click)="eliminarTalla(v, j)">❌</button>
      </div>

      <button type="button" (click)="agregarTalla(v)">+ Añadir talla</button>

      <h4>Imágenes</h4>
      <input type="file" multiple (change)="onFilesSelected($event, v)" />

      <div class="preview-images">
        <div *ngFor="let img of v.imagenes">
          <img [src]="img.url" width="80" />
          <button type="button" (click)="eliminarImagen(v, img)">🗑️</button>
        </div>
      </div>

      <button type="button" (click)="eliminarVariante(i)">
        Eliminar variante
      </button>

      <hr />
    </div>

    <button type="button" (click)="agregarVariante()">+ Añadir variante</button>

    <br /><br />
    <button type="submit">Guardar producto</button>
  </form>
</div>

<div *ngIf="cargando">Cargando producto...</div>
