<div class="product-form" *ngIf="producto && !cargando">
  <div class="header-edit">
    <h2>Editar: {{ producto.nombre }}</h2>
    <button type="button" class="btn-danger" (click)="eliminarProducto()">🗑️ Eliminar</button>
  </div>

  <form (ngSubmit)="guardarProducto()">
    <section class="section">
      <div class="field">
        <label>Nombre del Producto</label>
        <input [(ngModel)]="producto.nombre" name="nombre" required />
      </div>

      <div class="grid-2">
        <div class="field">
          <label>Marca</label>
          <!-- <app-brand-selector 
            [marcas]="marcas" 
            [initialValue]="producto.marca?.nombre"
            (brandChanged)="onBrandChanged($event)">
          </app-brand-selector> -->
        </div>
        <div class="field">
          <label>Público Objetivo</label>
          <select [(ngModel)]="producto.publico_objetivo" name="publico">
            <option value="Mujer">Mujer</option>
            <option value="Hombre">Hombre</option>
            <option value="Unisex">Unisex</option>
            <option value="Niño/a">Niño/a</option>
          </select>
        </div>
      </div>

      <div class="field">
        <label>Descripción</label>
        <textarea [(ngModel)]="producto.descripcion" name="descripcion" rows="3"></textarea>
      </div>
    </section>

    <h3>Configuración de Variantes (Colores/Materiales)</h3>
    <div *ngFor="let v of producto.variantes; let i = index" class="variant-card">
      
      <div class="grid-3">
        <div class="field">
          <label>Identidad (Color/Mat)</label>
          <input [(ngModel)]="v.identidad_variante" name="ident_v_{{i}}" />
        </div>
        <div class="field">
          <label>Color Hex</label>
          <input type="color" [(ngModel)]="v.hex_identidad" name="hex_v_{{i}}" />
        </div>
        <div class="field">
          <label>Ubicación Física</label>
          <input [(ngModel)]="v.ubicacion" name="ub_v_{{i}}" placeholder="Ej: Pasillo A" />
        </div>
      </div>

      <div class="images-section">
        <label>Imágenes de esta variante</label>
        <div class="image-preview">
          <div *ngFor="let imgUrl of v.imagenes" class="image-box">
            <img [src]="imgUrl" />
            <button type="button" class="btn-img-del" (click)="eliminarImagenExistente(v, imgUrl)">×</button>
          </div>
          <div class="upload-placeholder">
            <input type="file" multiple (change)="onFilesSelected($event, v)" id="file_{{i}}" hidden />
            <label for="file_{{i}}" class="btn-add-img">📸 +</label>
          </div>
        </div>
      </div>

      <div class="stock-section">
        <label>Inventario (Tallas / Unidades)</label>
        <table>
          <thead>
            <tr>
              <th>Etiqueta (Talla)</th>
              <th>Cantidad</th>
              <th>P. Compra</th>
              <th>P. Venta</th>
              <th>Fecha Compra</th>
              <th></th>
            </tr>
          </thead>
          <tbody>
            <tr *ngFor="let s of v.stocks; let j = index">
              <td><input [(ngModel)]="s.etiqueta" name="et_s_{{i}}_{{j}}" placeholder="M, XL, 42..." /></td>
              <td><input type="number" [(ngModel)]="s.cantidad" name="can_s_{{i}}_{{j}}" /></td>
              <td><input type="number" [(ngModel)]="s.precio_compra" name="pc_s_{{i}}_{{j}}" step="0.01" /></td>
              <td><input type="number" [(ngModel)]="s.precio_venta" name="pv_s_{{i}}_{{j}}" step="0.01" /></td>
              <td><input type="date" [(ngModel)]="s.fecha_compra" name="f_s_{{i}}_{{j}}" /></td>
              <td><button type="button" (click)="eliminarStock(v, j)">🗑️</button></td>
            </tr>
          </tbody>
        </table>
        <button type="button" class="btn-add-stock" (click)="agregarStock(v)">+ Añadir otra talla</button>
      </div>

      <button type="button" class="variant-del" (click)="eliminarVariante(i)">Eliminar Variante Completa</button>
    </div>

    <button type="button" class="btn-add-variant" (click)="agregarVariante()">+ Nueva Variante de Color</button>

    <div class="form-footer">
      <button type="submit" class="btn-primary">💾 Guardar Todos los Cambios</button>
    </div>
  </form>
</div>
