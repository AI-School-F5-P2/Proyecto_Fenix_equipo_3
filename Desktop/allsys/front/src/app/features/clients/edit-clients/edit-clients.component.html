<div class="page-container">
  
  <header class="form-header">
    <div class="header-left">
      <button class="btn-back" (click)="volver()">←</button>
      <h2 class="title">✏️ Editar Ficha de Cliente</h2>
    </div>
    <span *ngIf="cliente.es_vip" class="vip-badge">⭐ CLIENTE VIP</span>
  </header>

  <div *ngIf="cargando" class="loading-overlay">
    <p>⏳ Cargando datos de la base de datos...</p>
  </div>

  <form *ngIf="!cargando" (ngSubmit)="actualizarCliente()" class="client-form">
    
    <section class="card-section">
      <div class="section-title"><h3>👤 Información Personal</h3></div>
      <div class="grid-2">
        <div class="field">
          <label>Nombre</label>
          <input type="text" [(ngModel)]="cliente.nombre" name="nombre" placeholder="Nombre" />
        </div>
        <div class="field">
          <label>Apellidos</label>
          <input type="text" [(ngModel)]="cliente.apellidos" name="apellidos" placeholder="Apellidos" />
        </div>
        <div class="field">
          <label>DNI / NIE</label>
          <input type="text" [(ngModel)]="cliente.dni_nie" name="dni" placeholder="Doc. Identidad" />
        </div>
        <div class="field toggle-field">
          <label class="toggle-switch">
            <input type="checkbox" [(ngModel)]="cliente.es_vip" name="esVip" />
            <span class="slider"></span>
            <span class="label-text">Cliente VIP</span>
          </label>
        </div>
      </div>
    </section>

    <section class="card-section">
      <div class="section-title"><h3>🌐 Canales y Contacto</h3></div>
      <div class="grid-2">
        <div class="field">
          <label>👗 Vinted</label>
          <div class="input-icon">
            <span class="icon">&#64;</span>
            <input type="text" [(ngModel)]="cliente.usuario_vinted" name="vinted" />
          </div>
        </div>
        <div class="field">
          <label>📦 Wallapop</label>
          <div class="input-icon">
            <span class="icon">&#64;</span>
            <input type="text" [(ngModel)]="cliente.usuario_wallapop" name="wallapop" />
          </div>
        </div>
        <div class="field">
          <label>📱 WhatsApp / Tel.</label>
          <input type="tel" [(ngModel)]="cliente.telefono" name="telefono" />
        </div>
        <div class="field">
          <label>📧 Email</label>
          <input type="email" [(ngModel)]="cliente.email" name="email" />
        </div>
      </div>
    </section>

    <section class="card-section">
      <div class="section-title"><h3>📍 Dirección de Envío</h3></div>
      <div class="field full-width">
        <label>Calle y Número</label>
        <input type="text" [(ngModel)]="cliente.direccion" name="direccion" />
      </div>
      <div class="grid-3">
        <div class="field"><label>C.P.</label><input type="text" [(ngModel)]="cliente.codigo_postal" name="cp" /></div>
        <div class="field"><label>Ciudad</label><input type="text" [(ngModel)]="cliente.ciudad" name="ciudad" /></div>
        <div class="field">
          <label>País</label>
          <select [(ngModel)]="cliente.pais" name="pais">
            <option *ngFor="let p of listaPaises" [value]="p.nombre">{{p.bandera}} {{p.nombre}}</option>
          </select>
        </div>
      </div>
    </section>

    <section class="card-section notes-area">
      <div class="section-title"><h3>📝 Notas del CRM</h3></div>
      <textarea [(ngModel)]="cliente.notas_internas" name="notas" rows="3" placeholder="Anotaciones privadas sobre el cliente..."></textarea>
    </section>

    <div class="footer-actions">
      <button type="button" class="btn-delete" (click)="desactivar()" [disabled]="isSubmitting">
        🗑️ Desactivar Cliente
      </button>

      <div class="group-right">
        <button type="button" class="btn-cancel" (click)="volver()" [disabled]="isSubmitting">Cancelar</button>
        <button type="submit" class="btn-save" [disabled]="isSubmitting">
          {{ isSubmitting ? '⌛ Guardando...' : '💾 Guardar Cambios' }}
        </button>
      </div>
    </div>

  </form>
</div>
