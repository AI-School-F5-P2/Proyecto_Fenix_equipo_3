<div class="color-selector-container">
  
  <div class="color-trigger" (click)="toggleDropdown()" [class.open]="dropdownOpen">
    <span class="swatch-preview" [style.background]="colorSeleccionado?.hex || '#fff'"></span>
    <span class="color-name">{{ colorSeleccionado?.nombre || 'Seleccionar color...' }}</span>
    <span class="arrow">▼</span>
  </div>

  <div class="color-dropdown" *ngIf="dropdownOpen">
    <div class="color-grid">
      <div 
        class="color-item" 
        *ngFor="let c of colores" 
        (click)="selectColor(c)"
        [title]="c.nombre"
        [class.active]="c.hex === colorSeleccionado?.hex">
        
        <span class="color-circle" [style.background]="c.hex">
          <span class="check" *ngIf="c.hex === colorSeleccionado?.hex">✓</span>
        </span>
        <span class="item-label">{{ c.nombre }}</span>
      </div>
    </div>
  </div>
</div>
